<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vatu - Revue extraction IA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    background: #f4f5f7;
    color: #1a1a2e;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  header button {
    background: #2d2d4d;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #gate {
    max-width: 360px;
    margin: 80px auto;
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  #gate h2 { font-size: 16px; margin-top: 0; }
  #gate input {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  #gate button {
    width: 100%;
    padding: 10px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  #gate-error { color: #ea4335; font-size: 13px; margin-top: 8px; min-height: 18px; }
  #app { display: none; }
  #stats-panel {
    background: #fff;
    margin: 16px 24px;
    padding: 16px;
    border-radius: 8px;
    display: none;
  }
  #stats-panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #stats-panel th, #stats-panel td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
  #list { padding: 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .card.verified { opacity: 0.55; }
  .meta { font-size: 13px; color: #555; margin-bottom: 8px; }
  .meta strong { color: #1a1a2e; }
  .field-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .field-row .label { width: 100px; color: #666; font-size: 12px; text-transform: uppercase; }
  .field-row .value { flex: 1; font-family: monospace; }
  .field-row .choice { display: flex; gap: 4px; }
  .field-row button {
    border: 1px solid #ccc;
    background: #fafafa;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .field-row button.active-yes { background: #d4f4dd; border-color: #34a853; }
  .field-row button.active-no { background: #fbdadb; border-color: #ea4335; }
  .save-btn {
    margin-top: 10px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  iframe { width: 100%; height: 420px; border: 1px solid #ddd; border-radius: 6px; }
  #empty { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>
<div id="gate">
  <h2>Vatu — Accès protégé</h2>
  <form id="gate-form">
    <input id="gate-input" name="secret" type="password" placeholder="Code d'accès" autocomplete="off" autofocus />
    <button type="submit">Accéder</button>
  </form>
  <div id="gate-error"></div>
</div>

<div id="app">
<header>
  <h1>Vatu — Revue de "Lire avec l'IA" (point #21)</h1>
  <div>
    <button id="btn-stats">Statistiques</button>
    <button id="btn-toggle-all">Voir tout (y compris déjà vérifié)</button>
  </div>
</header>

<div id="stats-panel"></div>
<div id="list"><div id="empty">Chargement...</div></div>
</div>

<script src="admin-extraction-review.js"></script>
</body>
</html>
